<!DOCTYPE html>
<html>

<head>
    <title>Iris Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .form-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 20px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        input {
            padding: 8px;
            width: 130px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #4CAF50;
        }

        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }

        #error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h2>🌸 Iris Flower Prediction</h2>

    <div class="form-container">
        <input type="number" step="any" id="sepal_length" placeholder="Sepal Length" required>
        <input type="number" step="any" id="sepal_width" placeholder="Sepal Width" required>
        <input type="number" step="any" id="petal_length" placeholder="Petal Length" required>
        <input type="number" step="any" id="petal_width" placeholder="Petal Width" required>
        <button onclick="predictIris()">Predict</button>
    </div>

    <div id="result"></div>
    <div id="error"></div>

    <script>
        async function predictIris() {
            const sepal_length = parseFloat(document.getElementById("sepal_length").value);
            const sepal_width = parseFloat(document.getElementById("sepal_width").value);
            const petal_length = parseFloat(document.getElementById("petal_length").value);
            const petal_width = parseFloat(document.getElementById("petal_width").value);

            // Clear previous messages
            document.getElementById("result").textContent = "";
            document.getElementById("error").textContent = "";

            // Validation
            if ([sepal_length, sepal_width, petal_length, petal_width].some(isNaN)) {
                document.getElementById("error").textContent = "⚠️ Please enter all values.";
                return;
            }

            try {
                const response = await fetch("http://127.0.0.1:4000/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        data: [sepal_length, sepal_width, petal_length, petal_width]
                    })
                });

                if (!response.ok) throw new Error("Server error");

                const result = await response.json();

                // Fix: extract prediction properly
                const predictionValue = Array.isArray(result.predictions)
                    ? result.predictions[0]
                    : result.predictions || result.prediction || "Unknown";

                const labelMap = {
                    0: "Iris Setosa 🌼",
                    1: "Iris Versicolor 🌷",
                    2: "Iris Virginica 🌺"
                };

                document.getElementById("result").textContent =
                    `🌼 Predicted Iris Species: ${labelMap[predictionValue] || predictionValue}`;
            } catch (error) {
                document.getElementById("error").textContent = "❌ Error predicting iris flower. Please try again.";
                console.error(error);
            }
        }
    </script>
</body>

</html>
